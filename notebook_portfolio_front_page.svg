<svg width="100%" viewBox="0 0 680 920" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Portfolio Notebook Front Page</title>
  <desc>A red-themed portfolio notebook front page design with decorative elements and centered title</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Notebook page background -->
  <rect x="60" y="30" width="560" height="860" rx="6" fill="#fff9f9" stroke="#C0202020" stroke-width="0.5"/>

  <!-- Red spine strip -->
  <rect x="60" y="30" width="32" height="860" rx="6" fill="#C0202020"/>
  <rect x="76" y="30" width="16" height="860" fill="#A32D2D"/>

  <!-- Spiral binding dots on spine -->
  <circle cx="84" cy="80" r="5" fill="#791F1F"/><circle cx="84" cy="80" r="3" fill="#F7C1C1"/>
  <circle cx="84" cy="130" r="5" fill="#791F1F"/><circle cx="84" cy="130" r="3" fill="#F7C1C1"/>
  <circle cx="84" cy="180" r="5" fill="#791F1F"/><circle cx="84" cy="180" r="3" fill="#F7C1C1"/>
  <circle cx="84" cy="230" r="5" fill="#791F1F"/><circle cx="84" cy="230" r="3" fill="#F7C1C1"/>
  <circle cx="84" cy="280" r="5" fill="#791F1F"/><circle cx="84" cy="280" r="3" fill="#F7C1C1"/>
  <circle cx="84" cy="330" r="5" fill="#791F1F"/><circle cx="84" cy="330" r="3" fill="#F7C1C1"/>
  <circle cx="84" cy="380" r="5" fill="#791F1F"/><circle cx="84" cy="380" r="3" fill="#F7C1C1"/>
  <circle cx="84" cy="430" r="5" fill="#791F1F"/><circle cx="84" cy="430" r="3" fill="#F7C1C1"/>
  <circle cx="84" cy="480" r="5" fill="#791F1F"/><circle cx="84" cy="480" r="3" fill="#F7C1C1"/>
  <circle cx="84" cy="530" r="5" fill="#791F1F"/><circle cx="84" cy="530" r="3" fill="#F7C1C1"/>
  <circle cx="84" cy="580" r="5" fill="#791F1F"/><circle cx="84" cy="580" r="3" fill="#F7C1C1"/>
  <circle cx="84" cy="630" r="5" fill="#791F1F"/><circle cx="84" cy="630" r="3" fill="#F7C1C1"/>
  <circle cx="84" cy="680" r="5" fill="#791F1F"/><circle cx="84" cy="680" r="3" fill="#F7C1C1"/>
  <circle cx="84" cy="730" r="5" fill="#791F1F"/><circle cx="84" cy="730" r="3" fill="#F7C1C1"/>
  <circle cx="84" cy="780" r="5" fill="#791F1F"/><circle cx="84" cy="780" r="3" fill="#F7C1C1"/>
  <circle cx="84" cy="830" r="5" fill="#791F1F"/><circle cx="84" cy="830" r="3" fill="#F7C1C1"/>

  <!-- Top header bar -->
  <rect x="92" y="30" width="528" height="70" fill="#A32D2D"/>
  <line x1="112" y1="88" x2="600" y2="88" stroke="#F7C1C1" stroke-width="0.5"/>
  <text x="356" y="73" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#FCEBEB" letter-spacing="8">PORTFOLIO</text>

  <!-- Decorative corners -->
  <rect x="570" y="110" width="40" height="4" fill="#A32D2D"/>
  <rect x="596" y="110" width="4" height="40" fill="#A32D2D"/>
  <rect x="110" y="110" width="40" height="4" fill="#A32D2D"/>
  <rect x="110" y="110" width="4" height="40" fill="#A32D2D"/>
  <line x1="110" y1="125" x2="610" y2="125" stroke="#E24B4A" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Central NOTEBOOK label -->
  <rect x="150" y="360" width="420" height="120" rx="4" fill="none" stroke="#A32D2D" stroke-width="1.5"/>
  <rect x="160" y="370" width="400" height="100" rx="4" fill="#FCEBEB"/>
  <line x1="160" y1="384" x2="560" y2="384" stroke="#F7C1C1" stroke-width="0.5"/>
  <text x="360" y="435" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#A32D2D" letter-spacing="4">NOTEBOOK</text>

  <!-- Diamond ornaments -->
  <polygon points="360,330 372,348 360,355 348,348" fill="#A32D2D"/>
  <polygon points="360,336 368,348 360,351 352,348" fill="#F7C1C1"/>
  <polygon points="360,500 372,510 360,520 348,510" fill="#A32D2D"/>
  <polygon points="360,504 368,510 360,516 352,510" fill="#F7C1C1"/>

  <!-- Name & subtitle -->
  <text x="360" y="570" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#791F1F" letter-spacing="3">— YOUR NAME —</text>
  <line x1="200" y1="580" x2="520" y2="580" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="360" y="610" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#993556" letter-spacing="2">Creative Portfolio  ·  2025</text>

  <!-- Ruled lines -->
  <line x1="110" y1="670" x2="610" y2="670" stroke="#F7C1C1" stroke-width="0.5"/>
  <line x1="110" y1="695" x2="610" y2="695" stroke="#F7C1C1" stroke-width="0.5"/>
  <line x1="110" y1="720" x2="610" y2="720" stroke="#F7C1C1" stroke-width="0.5"/>
  <line x1="110" y1="745" x2="610" y2="745" stroke="#F7C1C1" stroke-width="0.5"/>
  <rect x="110" y="660" width="100" height="18" rx="2" fill="#A32D2D"/>
  <text x="160" y="673" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#FCEBEB" letter-spacing="2">SUBJECT</text>

  <!-- Small decorative squares -->
  <rect x="540" y="260" width="14" height="14" rx="2" fill="#E24B4A" opacity="0.5"/>
  <rect x="558" y="268" width="10" height="10" rx="2" fill="#A32D2D" opacity="0.4"/>
  <rect x="148" y="260" width="14" height="14" rx="2" fill="#E24B4A" opacity="0.5"/>
  <rect x="130" y="268" width="10" height="10" rx="2" fill="#A32D2D" opacity="0.4"/>

  <!-- Bottom footer -->
  <rect x="92" y="820" width="528" height="70" fill="#A32D2D"/>
  <rect x="92" y="856" width="528" height="34" rx="6" fill="#A32D2D"/>
  <line x1="112" y1="832" x2="600" y2="832" stroke="#F7C1C1" stroke-width="0.5"/>
  <text x="356" y="858" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#F7C1C1" letter-spacing="5">PERSONAL  ·  CREATIVE  ·  PROFESSIONAL</text>
  <line x1="200" y1="875" x2="520" y2="875" stroke="#F09595" stroke-width="0.5"/>

  <!-- Logo circle -->
  <circle cx="356" cy="806" r="20" fill="#791F1F" stroke="#F7C1C1" stroke-width="0.5"/>
  <text x="356" y="812" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#FCEBEB">N</text>

  <!-- Page number -->
  <text x="590" y="810" text-anchor="end" font-family="Georgia, serif" font-size="10" fill="#993556">01</text>
</svg>
